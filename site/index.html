<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Castle Hill Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: calm, plain-spoken facility office; Title Case labels, no jargon.
IDEA: the administrator's clipboard — one sheet that says what needs you first.
PICTURE: the "Needs You" list itself, ranked by risk, at the top of Today.
COLOUR and TYPE: white paper, deep slate-blue ink for structure, red only for overdue, amber for soon; Public Sans throughout.
LAYOUT: sticky header with search and tabs; one calm column of rows; sheets slide up for details and forms.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f6f6f3,#11151b);--paper:light-dark(#ffffff,#181d25);--ink:light-dark(#18202b,#e8ebef);--soft:light-dark(#5b6573,#9aa4b2);
--line:light-dark(#e4e5e1,#262d38);--brand:light-dark(#1f3a5f,#8fb3e0);--brandbg:light-dark(#1f3a5f,#1b2b42);--onbrand:#fff;
--red:light-dark(#b7352a,#ff8a7d);--redbg:light-dark(#fbeceb,#3a1d1b);--amber:light-dark(#9a5b00,#f2b75b);--amberbg:light-dark(#fdf3e2,#3a2c14);
--green:light-dark(#2d6a3e,#7fd197);--greenbg:light-dark(#e9f4ec,#183022);--blue:light-dark(#2457a5,#8fb3e0);--bluebg:light-dark(#e8eff9,#1b2b42)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brandbg);color:var(--onbrand)}
.top{display:flex;gap:12px;align-items:center;padding:12px max(4vw,14px) 8px;max-width:1100px;margin:auto}
.top h1{font-size:20px;margin:0;font-weight:700;white-space:nowrap}
.top small{display:block;font-weight:400;opacity:.75;font-size:13px}
.search{flex:1;display:flex}
.search input{width:100%;border:0;border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.14);color:#fff;font-size:16px}
.search input::placeholder{color:rgba(255,255,255,.7)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 max(4vw,14px);max-width:1100px;margin:auto;scrollbar-width:none}
nav a{flex:none;color:#fff;opacity:.75;text-decoration:none;padding:10px 12px;font-weight:600;font-size:15px;border-bottom:3px solid transparent}
nav a.on{opacity:1;border-color:#fff}
main{max-width:1100px;margin:auto;padding:18px max(4vw,14px) 110px}
h2{font-size:28px;line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--soft);margin:0 0 16px}
h3{font-size:17px;margin:22px 0 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:light-dark(#fafaf8,#1c222b)}
.row .main{flex:1}
.row .t{font-weight:600}
.row .m{color:var(--soft);font-size:14px}
.pill{flex:none;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--bluebg);color:var(--blue)}
.pill.red{background:var(--redbg);color:var(--red)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.grey{background:light-dark(#eeeeea,#232a34);color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{color:var(--soft);font-size:14px}
.stat.red b{color:var(--red)}.stat.amber b{color:var(--amber)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:light-dark(#fff,#11151b)}
.btn.warn{color:var(--red)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.chip.on{background:var(--brand);color:light-dark(#fff,#11151b);border-color:var(--brand)}
.empty{padding:22px 16px;color:var(--soft);text-align:center}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--soft);background:none;cursor:pointer}
.check.done{background:var(--green);border-color:var(--green)}
.fab{position:fixed;right:max(4vw,16px);bottom:22px;width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:light-dark(#fff,#11151b);font-size:32px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.quick{display:flex;gap:8px;margin:0 0 14px}
.quick input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--paper);font-size:16px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheetbg.open{display:flex}
.sheet{background:var(--paper);width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(4vw,18px) 28px}
@media(min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:22px;margin:0 0 4px}
.f{display:block;margin:12px 0}
.f span{display:block;font-size:14px;font-weight:600;color:var(--soft);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px}
.f textarea{min-height:90px}
.kv{display:grid;grid-template-columns:9em 1fr;gap:6px 12px;margin:12px 0}
.kv dt{color:var(--soft);font-size:14px}.kv dd{margin:0}
.log{border-left:3px solid var(--line);padding-left:12px;margin:10px 0}
.log p{margin:6px 0;font-size:15px}.log time{color:var(--soft);font-size:13px;margin-right:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
a{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;z-index:30;display:none;gap:12px;align-items:center;max-width:92vw}
.toast.show{display:flex}.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.note{font-size:14px;color:var(--soft);margin:8px 0}
.banner{background:var(--amberbg);color:var(--amber);padding:10px 14px;border-radius:10px;margin:0 0 14px;font-size:14px;display:none}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;font-size:13px;width:100%;min-width:760px;background:var(--paper)}
.grid th,.grid td{border:1px solid var(--line);padding:6px;text-align:center}
.grid th:first-child,.grid td:first-child{text-align:left;min-width:190px;position:sticky;left:0;background:var(--paper)}
.grid td.due{background:var(--bluebg);color:var(--blue);font-weight:700}.grid td.late{background:var(--redbg);color:var(--red);font-weight:700}.grid td.ok{background:var(--greenbg);color:var(--green);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal div{background:var(--paper);border:1px solid var(--line);border-radius:8px;min-height:64px;padding:4px;font-size:12px}
.cal .h{min-height:0;border:0;background:none;text-align:center;color:var(--soft);font-weight:600}
.cal .x{opacity:.35}.cal .td{border-color:var(--brand)}
.cal i{display:block;font-style:normal;background:var(--bluebg);color:var(--blue);border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal i.p{opacity:.55}
table.fin{width:100%;border-collapse:collapse;background:var(--paper)}
.fin th,.fin td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.fin th:first-child,.fin td:first-child{text-align:left}
.answer{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.hl{background:var(--amberbg)}
@media(max-width:600px){.top h1 small{display:none}h2{font-size:24px}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Castle Hill<small>Hub</small></h1>
    <form class="search" id="sform"><input id="q" type="search" placeholder="Search everything… e.g. floor plans, boiler, Vanwell" aria-label="Search everything"></form>
  </div>
  <nav id="nav"></nav>
</header>
<main>
  <div class="banner" id="banner"></div>
  <div id="view"></div>
</main>
<button class="fab" id="fab" aria-label="Add">+</button>
<div class="sheetbg" id="sheetbg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"><span id="toastmsg"></span><button id="undo">Undo</button></div>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script>
{
const FAC = {name:"Optima Care Castle Hill", addr:"615 23rd St, Union City, NJ 07087", admin:"Michael Lifschutz, Administrator", email:"mlifschutz@optimacarecastlehill.com"};
const TABS = [["today","Today"],["todo","To-Do"],["safety","Life Safety"],["docs","Documents"],["qapi","QAPI"],["timeoff","Time Off"],["finance","Finance"],["daily","Daily"],["contacts","Contacts"],["ask","Ask"]];
const SECTIONS = ["todos","inspections","docs","contacts","qapi","timeoff","finance","facility","daily"];
const FREQ = {"Weekly":0.25,"Monthly":1,"Quarterly":3,"Semi-Annual":6,"Annual":12,"Every 2 Years":24,"Every 3 Years":36,"Every 4 Years":48,"Every 5 Years":60};
const TODO_CATS = ["Life Safety","Compliance & Survey","HR / Staff","Purchases","Invoices & AP","Finance","Vendors","General"];
const DOC_FOLDERS = ["Licenses & Certificates","Insurance","Contracts","Compliance & Survey Letters","Emergency Prep","Facility Info","QAPI Documents","Financial Source Files","Mail Attachments","HR – Owner Only","Other"];
const DEPTS = ["Administration","Nursing","Admissions","Business Office","Dietary","Housekeeping","Laundry","Maintenance","MDS","Medical Records","Recreation","Rehab","Social Services","Staff Education","HR","Infection Control","Pharmacy","Lab","Wound Care"];
let S = {}; SECTIONS.forEach(k=>S[k]= k==="finance"?{months:[],target:300000}: k==="facility"?{items:[]}:k==="daily"?{days:[],targets:{nursing:129,agency:15,census:147}}:[]);
let db=null, assets=null, sample=null, canWrite=true, loaded=false;const lastJSON={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const pd=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d||1)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const days=s=>{const d=pd(s);if(!d)return null;const t=pd(todayISO());return Math.round((d-t)/864e5)};
const fmt=s=>{const d=pd(s);return d?d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—"};
const money=n=>n==null||n===""||isNaN(n)?"—":(n<0?"−":"")+"$"+Math.abs(Math.round(n)).toLocaleString();
function addMonths(s,m){const d=pd(s);if(!d)return null;if(m<1){d.setDate(d.getDate()+Math.round(m*28));return iso(d)}d.setMonth(d.getMonth()+m);return iso(d)}
function nextDue(i){return i.nextDue||(i.lastDone&&FREQ[i.freq]?addMonths(i.lastDone,FREQ[i.freq]):null)}
function dueState(s,soon=30){if(!s)return["Needs Date","grey"];const n=days(s);if(n<0)return[(-n)+" Days Overdue","red"];if(n===0)return["Due Today","amber"];if(n<=soon)return["Due In "+n+" Days","amber"];return["Due "+fmt(s),"blue"]}
function expState(s){if(!s)return["No Expiration","grey"];const n=days(s);if(n<0)return["Expired "+fmt(s),"red"];if(n<=60)return["Expires In "+n+" Days","amber"];return["Valid To "+fmt(s),"green"]}
function blobUrl(f){return f&&f.id?"/_blob/"+f.id:""}

/* ---------- storage ---------- */
async function save(sec){
  if(!db){toast("Saved on this screen only — storage isn't available here");return}
  const body=sec==="finance"?S.finance:sec==="facility"?S.facility:sec==="daily"?S.daily:{items:S[sec]};lastJSON[sec]=JSON.stringify(body);
  try{await db.doc("hub/"+sec).set(JSON.parse(lastJSON[sec]))}
  catch(e){toast(e&&e.code==="quota_exceeded"?"Storage is full":"Couldn't save — try again");if(e&&e.code==="invalid_argument"){canWrite=false;}}
}
let undoFn=null,tt=null;
function toast(msg,undo){$("#toastmsg").textContent=msg;undoFn=undo||null;$("#undo").style.display=undo?"":"none";$("#toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("#toast").classList.remove("show"),5000)}
$("#undo").onclick=()=>{if(undoFn)undoFn();$("#toast").classList.remove("show")};

/* ---------- sheet + forms ---------- */
function openSheet(html){$("#sheet").innerHTML=html;$("#sheetbg").classList.add("open");const f=$("#sheet").querySelector("input,select,textarea,button");if(f)f.focus()}
function closeSheet(){$("#sheetbg").classList.remove("open")}
$("#sheetbg").addEventListener("click",e=>{if(e.target.id==="sheetbg")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function field(f,v){const val=v??f.def??"";const id="f_"+f.k;
  let inp;
  if(f.type==="select")inp=`<select id="${id}">${f.opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.type==="textarea")inp=`<textarea id="${id}">${esc(val)}</textarea>`;
  else if(f.type==="file")inp=`<input id="${id}" type="file" accept="image/*,application/pdf">`;
  else inp=`<input id="${id}" type="${f.type||"text"}" value="${esc(val)}" ${f.type==="number"?'inputmode="decimal" step="any"':""}>`;
  return `<label class="f"><span>${esc(f.label)}</span>${inp}</label>`}
function form(title,fields,vals,onSave,opts={}){
  openSheet(`<h2>${esc(title)}</h2>${opts.intro?`<p class="note">${opts.intro}</p>`:""}<form id="frm">${fields.map(f=>field(f,vals&&vals[f.k])).join("")}
  <div class="acts"><button class="btn pri" type="submit">Save</button><button class="btn" type="button" id="cancel">Cancel</button>${opts.del?'<button class="btn warn" type="button" id="del">Delete</button>':""}</div></form>`);
  $("#cancel").onclick=closeSheet;
  if(opts.del)$("#del").onclick=()=>{closeSheet();opts.del()};
  if(opts.onFile){const fi=fields.find(f=>f.type==="file");if(fi)$("#f_"+fi.k).addEventListener("change",e=>opts.onFile(e.target.files[0]))}
  $("#frm").onsubmit=async e=>{e.preventDefault();const out={};let file=null;
    for(const f of fields){const el=$("#f_"+f.k);if(f.type==="file"){file=el.files[0]||null}else out[f.k]=f.type==="number"?(el.value===""?null:Number(el.value)):el.value.trim()}
    const btn=$("#frm button[type=submit]");btn.disabled=true;btn.textContent="Saving…";
    if(file){const up=await upload(file);if(up)out._file=up}
    closeSheet();onSave(out)}}
async function upload(file){
  if(!assets){toast("File uploads aren't available in this view");return null}
  try{const r=await assets.upload(file);return{id:r.id,name:file.name,type:file.type,size:r.sizeBytes}}
  catch(e){toast("Upload failed — files must be under 20 MB");return null}}

/* ---------- mail helpers ---------- */
function mailto(to,subject,body,cc){return "mailto:"+encodeURIComponent(to||"")+"?"+(cc?"cc="+encodeURIComponent(cc)+"&":"")+"subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body)}
function emailSheet(to,cc,subject,body){
  openSheet(`<h2>Email</h2><p class="note">Check it, then tap Open In Email. Nothing is sent until you press Send in your email app.</p>
  <label class="f"><span>To</span><input id="m_to" value="${esc(to)}"></label><label class="f"><span>Cc</span><input id="m_cc" value="${esc(cc||"")}"></label>
  <label class="f"><span>Subject</span><input id="m_su" value="${esc(subject)}"></label><label class="f"><span>Message</span><textarea id="m_bo" style="min-height:200px">${esc(body)}</textarea></label>
  <div class="acts"><a class="btn pri" id="m_go" href="#" target="_blank" rel="noopener">Open In Email</a><button class="btn" id="m_cp" type="button">Copy Text</button><button class="btn" id="m_x" type="button">Close</button></div>`);
  const upd=()=>{$("#m_go").href=mailto($("#m_to").value,$("#m_su").value,$("#m_bo").value,$("#m_cc").value)};upd();
  ["#m_to","#m_cc","#m_su","#m_bo"].forEach(s=>$(s).addEventListener("input",upd));
  $("#m_cp").onclick=async()=>{try{await navigator.clipboard.writeText("To: "+$("#m_to").value+"\nCc: "+$("#m_cc").value+"\nSubject: "+$("#m_su").value+"\n\n"+$("#m_bo").value);toast("Copied")}catch(e){toast("Copy isn't allowed here — select the text instead")}};
  $("#m_x").onclick=closeSheet}
function contactByRole(word){return S.contacts.find(c=>(c.role+" "+c.company).toLowerCase().includes(word))}

/* ---------- Today ---------- */
function needs(){
  const out=[];
  S.inspections.forEach(i=>{const d=nextDue(i);if(i.booked&&days(i.booked)>=0)return;const n=d==null?null:days(d);
    if(n!=null&&n<0)out.push({w:3,d,kind:"Life Safety",t:i.name,p:dueState(d),go:()=>insp(i.id)});
    else if(n!=null&&n<=30)out.push({w:1,d,kind:"Life Safety",t:i.name,p:dueState(d),go:()=>insp(i.id)})});
  S.docs.forEach(x=>{if(!x.expires)return;const n=days(x.expires);if(n<0)out.push({w:3,d:x.expires,kind:"Document",t:x.title,p:expState(x.expires),go:()=>doc(x.id)});else if(n<=60)out.push({w:1,d:x.expires,kind:"Document",t:x.title,p:expState(x.expires),go:()=>doc(x.id)})});
  S.todos.forEach(t=>{if(t.done)return;const n=t.due?days(t.due):null;if(n!=null&&n<0)out.push({w:2,d:t.due,kind:t.cat,t:t.title,p:dueState(t.due),go:()=>todo(t.id)});else if(n!=null&&n<=7)out.push({w:1,d:t.due,kind:t.cat,t:t.title,p:dueState(t.due,7),go:()=>todo(t.id)})});
  S.timeoff.forEach(r=>{if(r.status==="Pending")out.push({w:1,d:r.start,kind:"Time Off",t:r.name+" — "+fmt(r.start)+(r.end&&r.end!==r.start?" to "+fmt(r.end):""),p:["Needs Approval","amber"],go:()=>tor(r.id)})});
  return out.sort((a,b)=>b.w-a.w||(a.d||"9").localeCompare(b.d||"9"))}
let NEEDS=[];
function vToday(){
  NEEDS=needs();
  const od=S.inspections.filter(i=>{const d=nextDue(i);return d&&days(d)<0&&!(i.booked&&days(i.booked)>=0)}).length;
  const open=S.todos.filter(t=>!t.done).length;
  const exp=S.docs.filter(x=>x.expires&&days(x.expires)<=60).length;
  const pend=S.timeoff.filter(r=>r.status==="Pending").length;
  const d=new Date();const h=d.getHours();
  return `<h2>${h<12?"Good Morning":h<17?"Good Afternoon":"Good Evening"}, Michael</h2><p class="sub">${d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})} · ${esc(FAC.name)}</p>
  <div class="stats">
   <div class="stat ${od?"red":""}" data-go="safety"><b>${od}</b><span>Inspections Overdue</span></div>
   <div class="stat" data-go="todo"><b>${open}</b><span>Open To-Dos</span></div>
   <div class="stat ${exp?"amber":""}" data-go="docs"><b>${exp}</b><span>Documents Expiring ≤ 60 Days</span></div>
   <div class="stat ${pend?"amber":""}" data-go="timeoff"><b>${pend}</b><span>Time Off To Approve</span></div>
  </div>
  <h3>Needs You · Most Urgent First</h3>
  <div class="card">${NEEDS.length?NEEDS.slice(0,25).map((n,k)=>`<div class="row" tabindex="0" data-need="${k}"><div class="main"><div class="t">${esc(n.t)}</div><div class="m">${esc(n.kind)}</div></div><span class="pill ${n.p[1]}">${esc(n.p[0])}</span></div>`).join(""):`<div class="empty">Nothing urgent. Nice.</div>`}</div>
  ${NEEDS.length>25?`<p class="note">${NEEDS.length-25} more items are in their tabs.</p>`:""}`}

/* ---------- To-Do ---------- */
let todoFilter="Open";
function guessCat(t){t=t.toLowerCase();
  if(/fire|boiler|elevator|sprinkler|generator|inspection|drill|legionella|grease|extinguisher|alarm|egress/.test(t))return"Life Safety";
  if(/doh|poc|survey|qapi|cms|rac|penalty|deficien|appeal|medicare/.test(t))return"Compliance & Survey";
  if(/hire|staff|raise|salary|employee|interview|hr\b|union|1199|time off|schedule/.test(t))return"HR / Staff";

function parseDue(text){const t=text.toLowerCase();const d=pd(todayISO());
  const wd=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  if(/\btoday\b/.test(t))return iso(d);if(/\btomorrow\b/.test(t)){d.setDate(d.getDate()+1);return iso(d)}
  for(let k=0;k<7;k++)if(t.includes(wd[k])){let add=(k-d.getDay()+7)%7||7;d.setDate(d.getDate()+add);return iso(d)}
  const m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);if(m){let y=m[3]?Number(m[3].length===2?"20"+m[3]:m[3]):d.getFullYear();const x=new Date(y,m[1]-1,m[2]);if(!m[3]&&x<d)x.setFullYear(y+1);return iso(x)}
  return""}

let lsView="list";
function lsGroups(){const g={Overdue:[],"Due In 30 Days":[],Booked:[],"Up To Date":[],"Needs A Date":[]};
  S.inspections.forEach(i=>{const d=nextDue(i);if(i.booked&&days(i.booked)>=0)g.Booked.push(i);else if(!d)g["Needs A Date"].push(i);else if(days(d)<0)g.Overdue.push(i);else if(days(d)<=30)g["Due In 30 Days"].push(i);else g["Up To Date"].push(i)});
  Object.values(g).forEach(a=>a.sort((x,y)=>(nextDue(x)||"9").localeCompare(nextDue(y)||"9")));return g}

  const bar=`<div class="bar"><button class="chip ${lsView==="list"?"on":""}" data-ls="list">List</button><button class="chip ${lsView==="year"?"on":""}" data-ls="year">Year Overview</button><button class="btn" id="addinsp">+ Add Inspection</button></div>`;
  if(lsView==="year")return `<h2>Life Safety · ${new Date().getFullYear()}</h2><p class="sub">Every inspection by month. Blue = due, red = late, green = done.</p>${bar}${yearGrid()}`;

  ${Object.entries(g).filter(([k,a])=>a.length).map(([k,a])=>`<h3>${k} · ${a.length}</h3><div class="card">${a.map(i=>{const d=nextDue(i);const st=i.booked&&days(i.booked)>=0?["Booked "+fmt(i.booked),"blue"]:dueState(d);return `<div class="row" tabindex="0" data-insp="${i.id}"><div class="main"><div class="t">${esc(i.name)}</div><div class="m">${esc(i.freq||"")}${i.vendor?" · "+esc(i.vendor):""}${i.lastDone?" · Last Done "+fmt(i.lastDone):""}</div></div><span class="pill ${st[1]}">${esc(st[0])}</span></div>`}).join("")}</div>`).join("")||`<div class="card"><div class="empty">No inspections yet.</div></div>`}`}
function yearGrid(){const y=new Date().getFullYear();const now=pd(todayISO());const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const rows=[...S.inspections].sort((a,b)=>a.name.localeCompare(b.name)).map(i=>{const cells=Array(12).fill("");
    (i.history||[]).concat(i.lastDone?[{d:i.lastDone}]:[]).forEach(h=>{const d=pd(h.d);if(d&&d.getFullYear()===y)cells[d.getMonth()]="ok"});
    const f=FREQ[i.freq];
    if(f>=1&&i.lastDone){let d=i.lastDone;for(let k=0;k<40;k++){d=addMonths(d,f);const x=pd(d);if(x.getFullYear()>y)break;if(x.getFullYear()===y&&cells[x.getMonth()]!=="ok")cells[x.getMonth()]=x<now?"late":"due"}}
    if(f<1)for(let m=0;m<12;m++)if(!cells[m])cells[m]=new Date(y,m+1,0)<now?"":"due";
    if(i.nextDue){const x=pd(i.nextDue);if(x.getFullYear()===y&&cells[x.getMonth()]!=="ok")cells[x.getMonth()]=x<now?"late":"due"}
    return `<tr><td><a href="#safety" data-insp="${i.id}">${esc(i.name)}</a></td>${cells.map(c=>`<td class="${c}">${c==="ok"?"✓":c==="late"?"!":c==="due"?"•":""}</td>`).join("")}</tr>`}).join("");

function vTimeoff(){if(!calMonth){const d=new Date();calMonth=[d.getFullYear(),d.getMonth()]}
  const [y,mo]=calMonth;const first=new Date(y,mo,1),start=new Date(y,mo,1-first.getDay());const t=todayISO();let cells="";
  for(let k=0;k<42;k++){const d=new Date(start);d.setDate(start.getDate()+k);const s=iso(d);
    const who=S.timeoff.filter(r=>r.status!=="Denied"&&r.start<=s&&(r.end||r.start)>=s);
    cells+=`<div class="${d.getMonth()!==mo?"x":""} ${s===t?"td":""}"><b>${d.getDate()}</b>${who.map(r=>`<i class="${r.status==="Pending"?"p":""}" data-tor="${r.id}">${esc(r.name.split(" ")[0])}</i>`).join("")}</div>`}
  const pend=S.timeoff.filter(r=>r.status==="Pending"),up=S.timeoff.filter(r=>r.status==="Approved"&&(r.end||r.start)>=t).sort((a,b)=>a.start.localeCompare(b.start));

  <h3>${first.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</h3>

function torRow(r){return `<div class="row" tabindex="0" data-tor="${r.id}"><div class="main"><div class="t">${esc(r.name)} · ${esc(r.dept||"")}</div><div class="m">${fmt(r.start)}${r.end&&r.end!==r.start?" – "+fmt(r.end):""} · ${esc(r.type||"")}${r.reason?" · "+esc(r.reason):""}</div></div><span class="pill ${r.status==="Approved"?"green":r.status==="Denied"?"grey":"amber"}">${esc(r.status)}</span></div>`}
function overlaps(r){return S.timeoff.filter(o=>o.id!==r.id&&o.status!=="Denied"&&o.start<=(r.end||r.start)&&(o.end||o.start)>=r.start)}
function tor(id){const r=S.timeoff.find(x=>x.id===id);if(!r)return;const ov=overlaps(r);
  openSheet(`<h2>${esc(r.name)}</h2><p class="note">${esc(r.dept||"")} · ${esc(r.type||"")}</p><dl class="kv"><dt>Dates</dt><dd>${fmt(r.start)}${r.end&&r.end!==r.start?" – "+fmt(r.end):""}</dd><dt>Status</dt><dd>${esc(r.status)}</dd>${r.reason?`<dt>Reason</dt><dd>${esc(r.reason)}</dd>`:""}</dl>

/* ---------- Daily Tracker ---------- */
function dayFields(){return[{k:"date",label:"Date",type:"date"},{k:"census",label:"Census",type:"number"},{k:"nHours",label:"In-House Nursing Hours (Maple)",type:"number"},{k:"nCost",label:"In-House Nursing Cost ($)",type:"number"},{k:"aHours",label:"Agency Hours (ESHYFT)",type:"number"},{k:"aCost",label:"Agency Cost ($)",type:"number"},{k:"notes",label:"Notes",type:"textarea"}]}
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
function ppdOf(list){const cd=list.reduce((a,d)=>a+(num(d.census)||0),0);if(!cd)return{};const sum=k=>{const xs=list.map(d=>num(d[k]));return xs.some(x=>x!=null)?xs.reduce((a,x)=>a+(x||0),0):null};
  const nC=sum("nCost"),aC=sum("aCost"),nH=sum("nHours"),aH=sum("aHours");
  return{census:cd/list.length,nPPD:nC==null?null:nC/cd,aPPD:aC==null?null:aC/cd,tPPD:nC==null&&aC==null?null:((nC||0)+(aC||0))/cd,hppd:nH==null&&aH==null?null:((nH||0)+(aH||0))/cd}}
function weekStart(s){const d=pd(s);d.setDate(d.getDate()-d.getDay());return iso(d)}
function vDaily(){const T=S.daily.targets;const ds=[...S.daily.days].sort((a,b)=>b.date.localeCompare(a.date));
  const m2=n=>n==null?"—":"$"+n.toFixed(2);const vs=(n,t)=>n==null||!t?"":n<=t?"green":"red";
  const L=ds[0];const p=L?ppdOf([L]):{};
  const card=(lbl,val,cls,go)=>`<div class="stat ${cls==="red"?"red":""}" ${go||""}><b style="${cls==="green"?"color:var(--green)":""}">${val}</b><span>${lbl}</span></div>`;
  const top=L?`<p class="sub">Latest: ${fmt(L.date)}</p><div class="stats">
    ${card("Census · Target "+T.census,L.census??"—",num(L.census)!=null&&num(L.census)<T.census?"red":"green")}
    ${card("Nursing PPD · Target $"+T.nursing,m2(p.nPPD),vs(p.nPPD,T.nursing))}
    ${card("Agency PPD · Target $"+T.agency,m2(p.aPPD),vs(p.aPPD,T.agency))}
    ${card("Nursing Hours PPD",p.hppd==null?"—":p.hppd.toFixed(2),"")}</div>`:"";
  const wk={};ds.forEach(d=>(wk[weekStart(d.date)]=wk[weekStart(d.date)]||[]).push(d));
  const ws=Object.keys(wk).sort().reverse();
  const wrows=ws.slice(0,8).map((w,k)=>{const a=ppdOf(wk[w]),b=ws[k+1]?ppdOf(wk[ws[k+1]]):{};
    const ch=(x,y)=>x!=null&&y!=null?`<br><small style="color:${x<=y?"var(--green)":"var(--red)"}">${x<=y?"▼":"▲"} $${Math.abs(x-y).toFixed(2)}</small>`:"";
    const e=pd(w);e.setDate(e.getDate()+6);
    return `<tr><td>${fmt(w).replace(/, \d{4}$/,"")} – ${fmt(iso(e)).replace(/, \d{4}$/,"")}<br><small class="note">${wk[w].length} day${wk[w].length>1?"s":""}</small></td><td>${a.census?a.census.toFixed(1):"—"}</td><td style="color:var(--${vs(a.nPPD,T.nursing)||"ink"})">${m2(a.nPPD)}${ch(a.nPPD,b.nPPD)}</td><td style="color:var(--${vs(a.aPPD,T.agency)||"ink"})">${m2(a.aPPD)}${ch(a.aPPD,b.aPPD)}</td><td>${m2(a.tPPD)}</td></tr>`}).join("");
  const drows=ds.slice(0,21).map(d=>{const q=ppdOf([d]);return `<tr data-day="${esc(d.date)}" tabindex="0" style="cursor:pointer"><td>${pd(d.date).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</td><td>${d.census??"—"}</td><td>${money(num(d.nCost))}</td><td style="color:var(--${vs(q.nPPD,T.nursing)||"ink"})">${m2(q.nPPD)}</td><td>${money(num(d.aCost))}</td><td style="color:var(--${vs(q.aPPD,T.agency)||"ink"})">${m2(q.aPPD)}</td></tr>`}).join("");
  return `<h2>Daily Tracker</h2><p class="sub">Census and nursing cost per patient day against budget. Green is at or under target.</p>
  <div class="bar"><button class="btn pri" id="addday">+ Add Day</button><button class="btn" id="settgd">Targets: $${T.nursing} Nursing · $${T.agency} Agency · ${T.census} Census</button></div>
  ${top}
  <h3>By Week (Sun–Sat)</h3><div class="scroll card"><table class="fin"><thead><tr><th>Week</th><th>Avg Census</th><th>Nursing PPD</th><th>Agency PPD</th><th>Total PPD</th></tr></thead><tbody>${wrows||`<tr><td colspan="5" class="empty">No weeks yet.</td></tr>`}</tbody></table></div>
  <h3>By Day</h3><div class="scroll card"><table class="fin"><thead><tr><th>Day</th><th>Census</th><th>Nursing Cost</th><th>Nursing PPD</th><th>Agency Cost</th><th>Agency PPD</th></tr></thead><tbody>${drows||`<tr><td colspan="6" class="empty">No days yet. Tap Add Day and type today's census and costs.</td></tr>`}</tbody></table></div>
  <p class="note">Tap a day to edit it. Weekly PPD is total cost ÷ total patient days. Staff names never appear here.</p>`}

/* ---------- Search ---------- */
function stem(w){return w.toLowerCase().replace(/(ies)$/,"y").replace(/(es|s)$/,"")}
function vSearch(q){const words=q.toLowerCase().split(/\W+/).filter(w=>w.length>1&&!["do","we","have","the","a","an","is","are","where","what","when","our","my","for","of","to","in","on","and","any"].includes(w)).map(stem);
  const hit=(...f)=>{const txt=f.join(" ").toLowerCase().split(/\W+/).map(stem);let sc=0;words.forEach(w=>{if(txt.some(t=>t===w))sc+=2;else if(txt.some(t=>t.startsWith(w)||w.startsWith(t)&&t.length>3))sc+=1});return sc};
  const R=[];
  S.inspections.forEach(i=>{const s=hit(i.name,i.vendor,i.contact,i.notes,(i.log||[]).map(l=>l.t).join(" "));if(s)R.push({s,t:i.name,k:"Life Safety",a:`data-insp="${i.id}"`})});
  S.docs.forEach(x=>{const s=hit(x.title,x.folder,x.notes,x.file&&x.file.name);if(s)R.push({s,t:x.title,k:"Documents",a:`data-doc="${x.id}"`})});
  S.todos.forEach(t=>{const s=hit(t.title,t.cat,t.notes);if(s)R.push({s,t:t.title,k:"To-Do"+(t.done?" (Done)":""),a:`data-todo="${t.id}"`})});
  S.contacts.forEach(c=>{const s=hit(c.name,c.role,c.company,c.notes);if(s)R.push({s,t:c.name,k:"Contacts",a:`data-con="${c.id}"`})});
  S.qapi.forEach(m=>{const s=hit(m.title,m.notes,(m.depts||[]).map(d=>d.name+" "+(d.report||"")).join(" "));if(s)R.push({s,t:m.title,k:"QAPI",a:`data-meet="${m.id}"`})});
  S.timeoff.forEach(r=>{const s=hit(r.name,r.dept,r.type);if(s)R.push({s,t:r.name+" · "+fmt(r.start),k:"Time Off",a:`data-tor="${r.id}"`})});
  R.sort((a,b)=>b.s-a.s);
  return `<h2>Results For “${esc(q)}”</h2><p class="sub">${R.length} found. ${sample?`Not finding it? <a href="#ask" id="toask">Ask instead</a>.`:""}</p><div class="card">${R.map(r=>`<div class="row" tabindex="0" ${r.a}><div class="main"><div class="t">${esc(r.t)}</div><div class="m">${esc(r.k)}</div></div></div>`).join("")||`<div class="empty">Nothing matched.</div>`}</div>`}

  documents:S.docs.map(x=>({title:x.title,folder:x.folder,expires:x.expires,notes:x.notes,hasFile:!!x.file})),
  todos:S.todos.map(t=>({title:t.title,cat:t.cat,due:t.due,done:t.done,notes:t.notes,log:(t.log||[]).slice(-3)})),
  contacts:S.contacts.map(c=>({name:c.name,role:c.role,company:c.company,email:c.email,phone:c.phone})),
  qapi:S.qapi.map(m=>({title:m.title,date:m.date,signin:!!m.signin,reported:(m.depts||[]).filter(d=>d.done).map(d=>d.name),missing:(m.depts||[]).filter(d=>!d.done).map(d=>d.name)})),
  timeoff:S.timeoff.map(r=>({name:r.name,dept:r.dept,start:r.start,end:r.end,status:r.status,type:r.type})),
  finance:S.finance,dailyTracker:{targets:S.daily.targets,days:[...S.daily.days].sort((a,b)=>a.date.localeCompare(b.date)).slice(-60)},facilityNumbers:S.facility.items})}
function vAsk(){return `<h2>Ask</h2><p class="sub">Ask in plain words about anything in the Hub. Answers come only from what's stored here.</p>
  ${sample?`<form id="askf" class="quick"><input id="askq" placeholder="e.g. What's overdue before the fire inspection?" aria-label="Question"><button class="btn pri">Ask</button></form>
  <div class="bar">${["What's overdue right now?","When does the boiler certificate expire?","Which QAPI reports are still missing?","What contracts renew in the next year?","Who is off next week?"].map(s=>`<button class="chip" data-ask="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  <div id="ans">${lastAnswer?`<div class="answer">${esc(lastAnswer)}</div>`:""}</div>`:`<div class="card"><div class="empty">Asking isn't available in this view. Search at the top still works.</div></div>`}`}
let askCtl=null;
async function ask(q){if(!sample||!q)return;$("#askq").value=q;const box=$("#ans");box.innerHTML=`<div class="answer">Thinking…</div>`;
  if(askCtl)askCtl.abort();askCtl=new AbortController();
  try{const r=await sample(`You are the assistant inside the Castle Hill Hub for Michael Lifschutz, Administrator of ${FAC.name}. Answer his question using ONLY the JSON data below. If the answer isn't in the data, say so plainly and suggest what to add. Be brief and concrete: lead with the answer, then short lines. Use Title Case names as they appear. Dates like "Nov 18, 2026". No markdown symbols like ** or #.\n\nDATA:\n${snapshot()}\n\nQUESTION: ${q}`,
    {signal:askCtl.signal,modelTier:"default",onText:({text})=>{lastAnswer=text;box.innerHTML=`<div class="answer">${esc(text)}</div>`}});
    lastAnswer=r.text;box.innerHTML=`<div class="answer">${esc(r.text)}</div>`}
  catch(e){if(e&&e.name==="AbortError")return;box.innerHTML=`<div class="answer">${e&&e.code==="rate_limited"?"Too many questions at once — wait a minute and try again.":e&&e.code==="not_granted"?"Asking needs your OK — tap Ask again and allow it.":"Couldn't get an answer right now."}</div>`}}

let searchQ="";
function route(){const h=location.hash.replace("#","");return TABS.some(t=>t[0]===h)?h:"today"}
function render(){const r=searchQ?"":route();
  $("#nav").innerHTML=TABS.map(([k,l])=>`<a href="#${k}" class="${k===r?"on":""}">${l}</a>`).join("");
  const V={today:vToday,todo:vTodo,safety:vSafety,docs:vDocs,qapi:vQapi,timeoff:vTimeoff,finance:vFinance,daily:vDaily,contacts:vContacts,ask:vAsk};
  $("#view").innerHTML=searchQ?vSearch(searchQ):(!loaded&&db?`<div class="empty">Loading your Hub…</div>`:V[r]());
  wire()}
function wire(){const v=$("#view");
  v.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>{location.hash=e.dataset.go});
  v.querySelectorAll("[data-need]").forEach(e=>e.onclick=()=>NEEDS[+e.dataset.need].go());
  v.querySelectorAll("[data-todo]").forEach(e=>e.onclick=ev=>{if(ev.target.closest("[data-tick]"))return;todo(e.dataset.todo)});
  v.querySelectorAll("[data-tick]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();tick(e.dataset.tick)});
  v.querySelectorAll("[data-tf]").forEach(e=>e.onclick=()=>{todoFilter=e.dataset.tf;render()});
  v.querySelectorAll("[data-insp]").forEach(e=>e.onclick=ev=>{ev.preventDefault();insp(e.dataset.insp)});
  v.querySelectorAll("[data-ls]").forEach(e=>e.onclick=()=>{lsView=e.dataset.ls;render()});
  v.querySelectorAll("[data-doc]").forEach(e=>e.onclick=()=>doc(e.dataset.doc));
  v.querySelectorAll("[data-df]").forEach(e=>e.onclick=()=>{docFolder=e.dataset.df;render()});
  v.querySelectorAll("[data-meet]").forEach(e=>e.onclick=()=>meet(e.dataset.meet));
  v.querySelectorAll("[data-tor]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();tor(e.dataset.tor)});
  v.querySelectorAll("[data-con]").forEach(e=>e.onclick=ev=>{if(ev.target.closest("[data-stop]"))return;con(e.dataset.con)});
  v.querySelectorAll("[data-fac]").forEach(e=>e.onclick=()=>{const it=S.facility.items[+e.dataset.fac];form("Edit Number",[{k:"k",label:"Label"},{k:"v",label:"Value"}],it,o=>{Object.assign(it,o);save("facility");render()},{del:()=>{S.facility.items.splice(+e.dataset.fac,1);save("facility");render()}})});
  v.querySelectorAll("[data-fin]").forEach(e=>e.onclick=()=>{const m=S.finance.months.find(x=>x.month===e.dataset.fin);form("Edit Month",finFields(),m,o=>{Object.assign(m,o);save("finance");render()},{del:()=>{S.finance.months=S.finance.months.filter(x=>x!==m);save("finance");render()}})});
  v.querySelectorAll("[data-ask]").forEach(e=>e.onclick=()=>ask(e.dataset.ask));
  const on=(id,fn)=>{const el=v.querySelector("#"+id);if(el)el.onclick=fn};
  const qa=v.querySelector("#qadd");if(qa)qa.onsubmit=e=>{e.preventDefault();const t=$("#qtext").value.trim();if(!t)return;S.todos.push({id:uid(),title:t,cat:guessCat(t),due:parseDue(t),notes:"",created:todayISO()});save("todos");render();toast("Added to "+guessCat(t))};
  const af=v.querySelector("#askf");if(af)af.onsubmit=e=>{e.preventDefault();ask($("#askq").value.trim())};
  on("addinsp",()=>form("Add Inspection",inspFields(),{freq:"Annual"},o=>{S.inspections.push({id:uid(),...o,log:[],history:[]});save("inspections");render()}));
  on("adddoc",addDoc);
  on("addmeet",()=>form("Add QAPI Meeting",[{k:"title",label:"Meeting Title",def:"Q4 2026 Quarterly Meeting"},{k:"date",label:"Date",type:"date"},{k:"notes",label:"Notes",type:"textarea"}],{},o=>{const dp=S.qapi.length?[...S.qapi].sort((a,b)=>b.date.localeCompare(a.date))[0].depts.map(d=>({name:d.name,done:false})):DEPTS.map(n=>({name:n,done:false}));S.qapi.push({id:uid(),...o,depts:dp});save("qapi");render()}));
  on("binder",binder);
  on("addtor",()=>form("Add Time Off Request",torFields(),{status:"Pending",type:"Vacation",start:todayISO()},o=>{const f=o._file;delete o._file;const r={id:uid(),...o,file:f||null,created:todayISO()};S.timeoff.push(r);save("timeoff");render();const ov=overlaps(r);if(ov.length)toast("Heads up: overlaps with "+ov.map(x=>x.name).join(", "))}));
  on("cprev",()=>{let[y,m]=calMonth;m--;if(m<0){m=11;y--}calMonth=[y,m];render()});on("cnext",()=>{let[y,m]=calMonth;m++;if(m>11){m=0;y++}calMonth=[y,m];render()});
  on("addfin",()=>form("Add Month",finFields(),{},o=>{if(!o.month)return;S.finance.months=S.finance.months.filter(x=>x.month!==o.month);S.finance.months.push(o);save("finance");render()}));
  on("settg",()=>form("Monthly EBITDAR Target",[{k:"target",label:"Target ($ Per Month)",type:"number"}],{target:S.finance.target},o=>{S.finance.target=o.target;save("finance");render()}));
  v.querySelectorAll("[data-day]").forEach(e=>e.onclick=()=>{const d=S.daily.days.find(x=>x.date===e.dataset.day);form("Edit Day",dayFields(),d,o=>{Object.assign(d,o);save("daily");render()},{del:()=>{S.daily.days=S.daily.days.filter(x=>x!==d);save("daily");render()}})});
  on("addday",()=>{const last=[...S.daily.days].sort((a,b)=>b.date.localeCompare(a.date))[0];form("Add Day",dayFields(),{date:todayISO(),census:last?last.census:""},o=>{if(!o.date)return;S.daily.days=S.daily.days.filter(x=>x.date!==o.date);S.daily.days.push(o);save("daily");render()})});
  on("settgd",()=>form("Daily Targets",[{k:"nursing",label:"Nursing Cost Per Patient Day ($)",type:"number"},{k:"agency",label:"Agency Cost Per Patient Day ($)",type:"number"},{k:"census",label:"Census Target",type:"number"}],S.daily.targets,o=>{Object.assign(S.daily.targets,o);save("daily");render()}));
  on("addcon",()=>form("Add Contact",conFields(),{},o=>{S.contacts.push({id:uid(),...o});save("contacts");render()}));
  on("addfac",()=>form("Add A Number",[{k:"k",label:"Label",def:""},{k:"v",label:"Value"}],{},o=>{S.facility.items.push(o);save("facility");render()}));
  on("toask",e=>{const q=searchQ;searchQ="";$("#q").value="";location.hash="ask";setTimeout(()=>ask(q),50)})}
window.addEventListener("hashchange",()=>{searchQ="";$("#q").value="";render();window.scrollTo(0,0)});
$("#sform").onsubmit=e=>{e.preventDefault();searchQ=$("#q").value.trim();render()};
$("#q").addEventListener("input",e=>{if(!e.target.value.trim()&&searchQ){searchQ="";render()}});
$("#fab").onclick=()=>{const r=route();
  if(r==="safety")return form("Add Inspection",inspFields(),{freq:"Annual"},o=>{S.inspections.push({id:uid(),...o,log:[],history:[]});save("inspections");render()});
  if(r==="docs")return addDoc();
  if(r==="daily")return $("#addday").click();
  if(r==="timeoff")return $("#addtor")&&$("#addtor").click();
  if(r==="contacts")return $("#addcon").click();
  form("Add To-Do",todoFields(),{cat:"General"},o=>{const f=o._file;delete o._file;S.todos.push({id:uid(),...o,files:f?[f]:[],created:todayISO()});save("todos");render();toast("Added")})};

render();
(async()=>{
  try{db=await claude.use("db")}catch(e){db=null}
  const timer=setTimeout(()=>{if(!loaded){const b=$("#banner");b.textContent="Your saved data can't be reached yet. It will appear when the connection comes back.";b.style.display="block"}},10000);
  try{assets=await claude.use("assets")}catch(e){assets=null}
  try{sample=await claude.use("sample")}catch(e){sample=null}
  if(!db){clearTimeout(timer);loaded=true;const b=$("#banner");b.textContent="Saving isn't available in this view — changes won't be kept.";b.style.display="block";render();return}
  db.collection("hub").onSnapshot(snap=>{
    snap.docs.forEach(d=>{const v=d.data()||{};const js=JSON.stringify(v);if(lastJSON[d.id]===js)return;lastJSON[d.id]=js;if(d.id==="finance")S.finance={months:v.months||[],target:v.target??300000};else if(d.id==="facility")S.facility={items:v.items||[]};else if(d.id==="daily")S.daily={days:v.days||[],targets:{nursing:129,agency:15,census:147,...(v.targets||{})}};else if(SECTIONS.includes(d.id))S[d.id]=JSON.parse(JSON.stringify(v.items||[]))});
    if(!snap.metadata.fromCache){loaded=true;clearTimeout(timer);$("#banner").style.display="none"}
    if(!$("#sheetbg").classList.contains("open"))render()},
  err=>{clearTimeout(timer);loaded=true;const b=$("#banner");b.textContent="Your saved data couldn't be loaded.";b.style.display="block";render()});
})();
}
</script>
</body>
</html>

# Renames the Hub's Netlify address and points Supabase sign-in links at it.
name: Rename site

on:
  workflow_dispatch:
    inputs:
      name:
        description: "New name (lowercase letters, numbers, dashes) -> https://NAME.netlify.app"
        required: true

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename on Netlify and update Supabase
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEW: ${{ github.event.inputs.name }}
        run: |
          set -euo pipefail
          echo "$NEW" | grep -Eq '^[a-z0-9][a-z0-9-]{2,60}$' || { echo "::error::Use lowercase letters, numbers and dashes"; exit 1; }
          site="${NETLIFY_SITE_ID:-}"
          if [ -z "$site" ]; then
            curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites?filter=all&per_page=100" > sites.json
            site=$(jq -r 'if length==1 then .[0].id else ([.[] | select(.name|test("incandescent-marzipan|castle";"i"))] | if length==1 then .[0].id else "" end) end' sites.json)
          fi
          [ -n "$site" ] || { echo "::error::Could not pick the Netlify site"; exit 1; }
          old=$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$site" | jq -r .ssl_url)
          code=$(curl -sS -o out.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/json" \
            "https://api.netlify.com/api/v1/sites/$site" -d "$(jq -n --arg n "$NEW" '{name:$n}')")
          if [ "$code" -ge 300 ]; then echo "::error::Netlify refused the name (HTTP $code) - it may be taken"; cat out.json; exit 1; fi
          url=$(jq -r .ssl_url out.json)
          echo "Netlify: $old -> $url"
          code=$(curl -sS -o sb.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/wrqafbjeafxdnzvhqafo/config/auth" \
            -d "$(jq -n --arg u "$url" '{site_url:$u, uri_allow_list:($u + "/**")}')")
          echo "Supabase site URL update: HTTP $code"; [ "$code" -lt 300 ] || { cat sb.json; exit 1; }
          echo "NEW ADDRESS: $url"
